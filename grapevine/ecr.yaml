AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ECR repository for the Grapevine Google Analytics MCP image. Its own stack
  because the image must be pushed before the runtime stack can reference it.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: grapevine-ga-mcp
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri

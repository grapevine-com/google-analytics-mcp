AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Base stack for the Grapevine Google Analytics MCP: the ECR repository and the
  runtime execution role. Separate from the runtime stack because the image must
  be pushed before the runtime can reference it, and because AgentCore rejects
  an execution role IAM hasn't finished propagating (a bare AccessDenied on
  CreateAgentRuntime), which a role created in the same stack seconds earlier
  hits.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: grapevine-ga-mcp
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      # The deploy role may only create and pass roles under this path.
      Path: /grapevine-ga-mcp/
      RoleName: grapevine-ga-mcp-runtime
      Description: Execution role the AgentCore Runtime assumes to run the GA MCP server.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/grapevine-ga-mcp
              # No CMK on the log group: a KMS key here costs a request per
              # write and burns the free tier.
              - Sid: Telemetry
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - cloudwatch:PutMetricData
                Resource: "*"

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RuntimeRoleArn:
    Value: !GetAtt RuntimeRole.Arn
    Export:
      Name: grapevine-ga-mcp-runtime-role-arn
